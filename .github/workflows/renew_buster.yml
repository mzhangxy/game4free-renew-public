name: Buster Renewer (WARP)

on:
  # 允许在 GitHub 网页端手动点击运行
  workflow_dispatch:

  schedule:
    # 每2小时自动执行一次
    - cron: '35 */6 * * *'

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      # =========================
      # 🟡 0️⃣ 检出代码 
      # =========================
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/game4free-renew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }} 
          path: private

      # =========================
      # 🟡 Node 环境
      # =========================
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 🟡 1️⃣ 全局网络优化与系统依赖
      # =========================
      - name: Install System Dependencies & Audio
        run: |
          echo "🔄 1. 禁用 IPv6 与无用推荐包 (防止 APT 假死和夹带私货)..."
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99no-install-recommends
          echo 'APT::Install-Suggests "false";' | sudo tee -a /etc/apt/apt.conf.d/99no-install-recommends
          
          echo "🌍 2. 暴力替换 Azure 镜像源为 Ubuntu 官方主源..."
          sudo find /etc/apt/ -type f -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +
          
          echo "📥 3. 更新软件菜单..."
          sudo apt-get update
          
          echo "📦 4. 安装极简依赖..."
          sudo apt-get install -y xvfb ffmpeg unzip curl pulseaudio alsa-utils
          
          echo "🌐 下载并安装最新版 Chrome (离线直连模式，防 Google 源崩溃)..."
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          
          echo "🔊 5. 配置虚拟声卡..."
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker || true
          pactl set-default-sink virtual_speaker || true
          pactl load-module module-virtual-source source_name=virtual_mic || true
          pactl set-default-source virtual_mic || true
      
      # =========================
      # 🟡 1️⃣ 安装系统依赖（音频）
      # =========================
      #- name: Install dependencies
      #  run: |
      #    sudo apt-get update
      #    sudo apt-get install -y xvfb wget unzip curl jq p7zip-full \
      #      pulseaudio alsa-utils ffmpeg

      # =========================
      # 🟡 2️⃣ Playwright 
      # =========================
      - name: Install playwright
        working-directory: ./private
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      # =========================
      # 🟡 3️⃣ 下载 Buster 
      # =========================
      - name: Download Buster
        working-directory: ./private
        run: |
          mkdir -p extensions/buster
          wget -O extensions/buster/buster.zip \
            https://github.com/dessant/buster/releases/download/v3.1.3/buster_captcha_solver_for_humans-3.1.3-chrome.zip

      - name: Unzip Buster
        working-directory: ./private
        run: |
          mkdir -p extensions/buster/unpacked
          7z x -y extensions/buster/buster.zip -oextensions/buster/unpacked

      # =========================
      # 🟡 4️⃣ 启用 WARP 
      # =========================
      - name: 创建WARP网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # 🟡 5️⃣ 调试 IP
      # =========================
      - name: Check IP
        run: |
          echo "🌍 当前 IP:"
          curl -s https://api.ipify.org
          echo
          curl -s https://ipinfo.io
          
      # =========================
      # 🟡 6️⃣ 运行脚本 
      # =========================
      - name: Run script
        working-directory: ./private
        run: |
          mkdir -p screenshots
          xvfb-run -a node renew.js

      # =========================
      # 🟡 7️⃣ 上传截图 
      # =========================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: private/screenshots/*

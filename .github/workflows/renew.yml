name: DrissionPage Research Renewer

on:
  workflow_dispatch:
  schedule:
    - cron: '35 */2 * * *'

jobs:
  run-renew:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/game4free-renew
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      # 假设你的 Xray 配置步骤在这里保持不变...

      - name: Run Renew Script
        working-directory: ./private
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PROXY: "127.0.0.1:10808"
        run: python renew.py

      # =========================
      # 🟢 关键：导出 Token 研究数据
      # =========================
      - name: Upload Token Research Data
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: recaptcha-token-results
          path: ./private/full_token.txt
          retention-days: 7

      - name: Upload Error HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: ./private/*.html
          retention-days: 3
